# =============================================================================
# Vulnerability Intelligence Service — S2.2
# Ingests CVEs from NVD / GHSA / OSV, normalizes them, and exposes severity
# scoring with EPSS-based exploit likelihood.
# =============================================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-intel"
version = "0.1.0"
description = "CVE ingestion and scoring engine (NVD + GHSA + OSV + EPSS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "VulnerabilityIntelligenceAgent" },
  { name = "AI-DevSecOps Command Center Team" },
]
keywords = ["cve", "vulnerability", "nvd", "ghsa", "osv", "epss", "sbom", "security"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "Topic :: Security",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  # HTTP & API
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  # Async + utilities
  "anyio==4.15.1",
  "tenacity==9.1.4",
  "structlog==26.1.0",
  "python-json-logger==4.2.0",
  "python-dateutil==2.9.0.post0",
  # Observability — SREEngineer-conformant
  "prometheus-client==0.26.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
  # Auth — JWT validation against auth-service
  "PyJWT[crypto]==2.15.0",
  # Caching / rate limit tracking
  "cachetools==7.2.0",
  # S2.8 hardening: per-feed validation + safe parsers
  "jsonschema==4.26.0",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "mypy==2.3.1",
  "ruff==0.16.8",
  "freezegun==1.5.5",
]

[project.scripts]
vuln-intel = "vuln_intel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vuln_intel = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
  "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF", "ASYNC"]
ignore = ["S101"]  # allow `assert` in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
