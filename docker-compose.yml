# =============================================================================
# AI-DevSecOps-Command-Center - Local Development Stack
# =============================================================================
# Brings up Postgres, Redis, all 13 backend services, the frontend, and
# the observability toolchain (Prometheus, Grafana, Loki, OTel collector).
# Use `make up` / `make down` for the common cases.
#
# Observability file layout (canonical, owned by SREEngineer):
#   infra/observability/prometheus/prometheus.yml
#   infra/observability/prometheus/alert-rules.yml
#   infra/observability/prometheus/recording-rules.yml
#   infra/observability/otel-collector/collector-config.yaml
#   infra/observability/alertmanager/alertmanager.yml
#   infra/observability/loki-config.yaml
#   infra/observability/grafana/provisioning/
#   infra/observability/grafana/dashboards/
# See `infra/observability/README.md` and
# `docs/observability/monitoring-architecture.md` for details.
# =============================================================================

x-service-base: &service-base
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - ccnet

services:
  # ---------------------------------------------------------------------------
  # Datastores
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cc-postgres
    environment:
      POSTGRES_USER: aicc
      POSTGRES_PASSWORD: aicc
      POSTGRES_DB: aicc
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init/postgres-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aicc -d aicc']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ccnet

  redis:
    image: redis:7-alpine
    container_name: cc-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ccnet

  # ---------------------------------------------------------------------------
  # Backend services
  # ---------------------------------------------------------------------------
  auth-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: auth
        PORT: 3001
    container_name: cc-auth
    environment:
      PORT: 3001
      DATABASE_URL: postgres://aicc:aicc@postgres:5432/aicc_auth
      EVENT_BUS_DRIVER: redis
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: agent
        PORT: 3002
    container_name: cc-agent
    environment:
      PORT: 3002
      EVENT_BUS_DRIVER: redis
      REDIS_URL: redis://redis:6379
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  security-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: security
        PORT: 3003
    container_name: cc-security
    environment:
      PORT: 3003
      DATABASE_URL: postgres://aicc:aicc@postgres:5432/aicc_security
      EVENT_BUS_DRIVER: redis
      REDIS_URL: redis://redis:6379
      AICC_DEMO_SEED: 'true'
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  incident-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: incident
        PORT: 3004
    container_name: cc-incident
    environment:
      PORT: 3004
      DATABASE_URL: postgres://aicc:aicc@postgres:5432/aicc_incident
      EVENT_BUS_DRIVER: redis
      REDIS_URL: redis://redis:6379
      AICC_DEMO_SEED: 'true'
    ports:
      - '3004:3004'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  compliance-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: compliance
        PORT: 3005
    container_name: cc-compliance
    environment:
      PORT: 3005
      DATABASE_URL: postgres://aicc:aicc@postgres:5432/aicc_compliance
      EVENT_BUS_DRIVER: redis
      REDIS_URL: redis://redis:6379
      AICC_DEMO_SEED: 'true'
    ports:
      - '3005:3005'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  integration-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: integration
        PORT: 3006
    container_name: cc-integration
    environment:
      PORT: 3006
      DATABASE_URL: postgres://aicc:aicc@postgres:5432/aicc_integration
      EVENT_BUS_DRIVER: redis
      REDIS_URL: redis://redis:6379
      AICC_DEMO_SEED: 'true'
    ports:
      - '3006:3006'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  kubernetes-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: kubernetes
        PORT: 4006
    container_name: cc-kubernetes
    environment:
      PORT: 4006
      DATABASE_URL: postgres://aicc:aicc@postgres:5432/aicc_kubernetes
    ports:
      - '4006:4006'
    depends_on:
      postgres:
        condition: service_healthy

  k8s-health-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: k8s-health
        PORT: 4007
    container_name: cc-k8s-health
    environment:
      PORT: 4007
    ports:
      - '4007:4007'

  runtime-security-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: runtime-security
        PORT: 4008
    container_name: cc-runtime-security
    environment:
      PORT: 4008
    ports:
      - '4008:4008'

  inventory-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: inventory
        PORT: 4009
    container_name: cc-inventory
    environment:
      PORT: 4009
    ports:
      - '4009:4009'

  cost-intelligence-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: cost-intelligence
        PORT: 4010
    container_name: cc-cost-intelligence
    environment:
      PORT: 4010
      PROMETHEUS_URL: http://prometheus:9090
      KUBERNETES_SERVICE_URL: http://kubernetes-service:4006
    ports:
      - '4010:4010'
    depends_on:
      # Not `prometheus` — that's behind the `observability` profile
      # (`docker compose --profile observability up`) and cost-intelligence
      # degrades to synthetic utilisation data when it's unreachable (see
      # utilisation/source.ts).
      - kubernetes-service

  topology-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: topology
        PORT: 4011
    container_name: cc-topology
    environment:
      PORT: 4011
      KUBERNETES_SERVICE_URL: http://kubernetes-service:4006
    ports:
      - '4011:4011'
    depends_on:
      - kubernetes-service

  reporting-service:
    <<: *service-base
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: reporting
        PORT: 4012
    container_name: cc-reporting
    environment:
      PORT: 4012
    ports:
      - '4012:4012'

  # ---------------------------------------------------------------------------
  # Frontend (AionUi)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Exercise the real proxy path in the compose stack instead of the
        # mock-on default the standalone Dockerfile build uses.
        VITE_USE_MOCKS: 'false'
    container_name: cc-frontend
    ports:
      - '5173:80'
    depends_on:
      - auth-service
      - agent-service
      - security-service
      - incident-service
      - compliance-service
      - integration-service
      - kubernetes-service
      - k8s-health-service
      - runtime-security-service
      - inventory-service
      - cost-intelligence-service
      - topology-service
      - reporting-service
    networks:
      - ccnet

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.0
    container_name: cc-prometheus
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./infra/observability/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - '9090:9090'
    networks:
      - ccnet

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:v0.27.0
    container_name: cc-alertmanager
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - '9093:9093'
    networks:
      - ccnet

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.2.0
    container_name: cc-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3011:3000'
    depends_on:
      - prometheus
    networks:
      - ccnet

  loki:
    profiles: [observability]
    image: grafana/loki:3.1.0
    container_name: cc-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '3100:3100'
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - ccnet

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: cc-otel
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./infra/observability/otel-collector/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    networks:
      - ccnet

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:

networks:
  ccnet:
    driver: bridge
    name: ccnet
    # Pinned (not Docker's auto-assigned range) so every service's default
    # TRUST_PROXY_CIDR (backend/packages/shared/src/http/index.ts) matches
    # the network nginx/other containers actually reach it from. See
    # docs/adr/0018-http-hardening.md.
    ipam:
      config:
        - subnet: 172.28.0.0/16
