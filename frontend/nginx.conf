server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — the app is entirely client-rendered (mock data, no
    # live API calls yet; see src/lib/api.ts), so no /api reverse proxy
    # is needed here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
