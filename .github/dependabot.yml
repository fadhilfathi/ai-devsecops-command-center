# =============================================================================
# Dependabot configuration
# Keeps dependencies, container images, and GitHub Actions up to date.
#
# Dependabot SECURITY updates (separate from version updates) must also be
# enabled at the repo level:
#   Settings → Code security and analysis → Dependabot security updates → ON
# When enabled, GitHub auto-opens PRs for any published security advisory
# affecting this repo's dependency graph. The labels below (security,
# automated) ensure those PRs show up in the same view as version updates.
# =============================================================================
# Label correlation with .github/labeler.yml:
#   - "dependencies"   → every Dependabot PR
#   - "automated"      → bot-generated
#   - "security"       → security-related (applied to vuln-fix PRs)
#   - "<area>"         → scope label (e.g. backend, frontend, ci, docker)
# =============================================================================

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm workspaces (frontend, backend services, shared, agents)
  # ---------------------------------------------------------------------------
  # Single pnpm-workspace-aware root entry covers every npm package in the
  # monorepo (frontend, all 13 backend services, shared, models). Per-directory
  # entries used to duplicate this and piled up ~30 overlapping PRs; deleted.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'automated'
      - 'security'
      - 'npm'
    groups:
      production:
        dependency-type: 'production'
      development:
        dependency-type: 'development'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
        # Major bumps are reviewed manually. NOTE: Dependabot security
        # updates ignore this `ignore` block — a major-version security
        # advisory still gets an individual PR regardless.

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:00'
      timezone: 'Etc/UTC'
    labels:
      - 'dependencies'
      - 'automated'
      - 'security'
      - 'ci'
    open-pull-requests-limit: 5

  # ---------------------------------------------------------------------------
  # Docker (base images in compose)
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'Etc/UTC'
    labels:
      - 'dependencies'
      - 'automated'
      - 'security'
      - 'docker'
    open-pull-requests-limit: 5

  # ---------------------------------------------------------------------------
  # Python security agents (pip has no workspace concept — one entry per
  # agent directory, each grouped by dependency type).
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'pip'
    directory: '/agents/roles/security/sbom-generator'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'automated', 'security', 'python', 'agents']
    groups:
      production:
        dependency-type: 'production'
      development:
        dependency-type: 'development'
  - package-ecosystem: 'pip'
    directory: '/agents/roles/security/vuln-intel'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'automated', 'security', 'python', 'agents']
    groups:
      production:
        dependency-type: 'production'
      development:
        dependency-type: 'development'
  - package-ecosystem: 'pip'
    directory: '/agents/roles/security/dependency-intel'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 5
    labels: ['dependencies', 'automated', 'security', 'python', 'agents']
    groups:
      production:
        dependency-type: 'production'
      development:
        dependency-type: 'development'
