name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:00 UTC.
    - cron: '0 4 * * 1'

permissions: {}

jobs:
  compose-smoke:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Write .env
        run: |
          AUTH_JWT_SECRET="$(openssl rand -base64 48)"
          AICC_CREDENTIAL_KEYS="v1:$(openssl rand -base64 32)"
          echo "::add-mask::${AUTH_JWT_SECRET}"
          echo "::add-mask::${AICC_CREDENTIAL_KEYS}"
          cp .env.example .env
          # These are appended after the copied defaults, so they win
          # (docker compose's env_file parsing keeps the last value for a
          # repeated key). VITE_USE_MOCKS is a frontend Docker build ARG
          # (see docker-compose.yml's frontend.build.args), not read from
          # .env, so it's not set here.
          {
            echo ""
            echo "AUTH_JWT_SECRET=${AUTH_JWT_SECRET}"
            echo "AUTH_DEV_BYPASS=false"
            # .env.example defaults to development; run the images the
            # way they ship so production-only safety checks are exercised.
            echo "NODE_ENV=production"
            echo "AICC_CREDENTIAL_KEYS=${AICC_CREDENTIAL_KEYS}"
          } >> .env
          echo "AUTH_JWT_SECRET=${AUTH_JWT_SECRET}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'

      - name: docker compose up
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run e2e smoke script
        run: node scripts/e2e-smoke.mjs

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: docker compose down
        if: always()
        run: docker compose down -v
