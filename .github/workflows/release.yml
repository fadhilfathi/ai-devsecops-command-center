name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.3.0) — must match package.json and have a CHANGELOG.md section'
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version input '$VERSION' is not a bare semver (e.g. 0.3.0)"
            exit 1
          fi

      - name: Verify package.json version matches
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match input ($VERSION)"
            exit 1
          fi

      - name: Verify CHANGELOG.md has a section for this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

      - name: Extract CHANGELOG section
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v ver="## [$VERSION]" '
            $0 == ver { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ inputs.version }}
          body_path: release-notes.md
          draft: false
