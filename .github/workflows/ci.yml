name: ci

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'
  PNPM_VERSION: '9.12.0'

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint, format, type-check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build workspace dependencies
        run: pnpm -r --filter "./backend/models" --filter "./backend/common/*" --filter "./backend/packages/*" build

      - name: Type-check
        run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # 2. Unit tests
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - backend/services/auth
          - backend/services/agent
          - backend/services/security
          - backend/services/incident
          - backend/services/compliance
          - backend/services/integration
          - backend/services/kubernetes
          - backend/services/k8s-health
          - backend/services/runtime-security
          - backend/services/inventory
          - backend/services/cost-intelligence
          - backend/services/topology
          - backend/services/reporting
          - backend/packages/shared
          - backend/models
          - frontend
          - tests/contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm -r --filter "./backend/models" --filter "./backend/common/*" --filter "./backend/packages/*" build

      - name: Test ${{ matrix.workspace }}
        run: pnpm --filter "./${{ matrix.workspace }}" --if-present test -- --reporter=verbose

  # ---------------------------------------------------------------------------
  # 3. Build artifacts
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm -r build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-output
          path: |
            backend/services/*/dist
            backend/packages/shared/dist
            frontend/dist
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 4. Docker images
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test-unit, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - agent
          - security
          - incident
          - compliance
          - integration
          - kubernetes
          - k8s-health
          - runtime-security
          - inventory
          - cost-intelligence
          - topology
          - reporting
          - frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build-only: nothing consumes pushed images yet, and GHCR pushes
      # need package-creation rights the default token lacks.
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || 'backend/Dockerfile' }}
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false
          tags: aicc/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
