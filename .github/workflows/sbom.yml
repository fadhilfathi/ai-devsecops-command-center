name: sbom

on:
  push:
    branches: [main]
    paths-ignore:
      - 'security/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'security/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cyclonedx.json --spec-version 1.5
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cyclonedx.xml --spec-version 1.5 --format xml

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom.cyclonedx.json
            sbom.cyclonedx.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload SBOM to Dependency-Track
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPENDENCY_TRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
        run: |
          if [ -n "$DEPENDENCY_TRACK_URL" ] && [ -n "$DEPENDENCY_TRACK_API_KEY" ]; then
            curl -sS -X POST "$DEPENDENCY_TRACK_URL/api/v1/bom" \
              -H "X-Api-Key: $DEPENDENCY_TRACK_API_KEY" \
              -H "Content-Type: multipart/form-data" \
              -F "project=ai-devsecops-command-center" \
              -F "autoCreate=true" \
              -F "bom=@sbom.cyclonedx.json"
          else
            echo "Dependency-Track not configured; skipping upload"
          fi
