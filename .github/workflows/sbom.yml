name: sbom

on:
  push:
    branches: [main]
    paths-ignore:
      - 'security/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'security/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Syft reads pnpm-lock.yaml directly; cyclonedx-npm shells out to
      # `npm ls`, which fails on pnpm's node_modules layout.
      - name: Generate CycloneDX SBOM (JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Generate CycloneDX SBOM (XML)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx
          output-file: sbom.cyclonedx.xml
          upload-artifact: false

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom.cyclonedx.json
            sbom.cyclonedx.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload SBOM to Dependency-Track
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPENDENCY_TRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
          DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
        run: |
          if [ -n "$DEPENDENCY_TRACK_URL" ] && [ -n "$DEPENDENCY_TRACK_API_KEY" ]; then
            curl -sS -X POST "$DEPENDENCY_TRACK_URL/api/v1/bom" \
              -H "X-Api-Key: $DEPENDENCY_TRACK_API_KEY" \
              -H "Content-Type: multipart/form-data" \
              -F "project=ai-devsecops-command-center" \
              -F "autoCreate=true" \
              -F "bom=@sbom.cyclonedx.json"
          else
            echo "Dependency-Track not configured; skipping upload"
          fi
