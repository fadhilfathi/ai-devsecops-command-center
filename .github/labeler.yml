# Auto-label rules
# https://github.com/actions/labeler
#
# Schema: labeler v5+ (required by actions/labeler v6/v7). Each label maps
# to an `any:`/`all:` list of changed-file globs. The previous file used the
# flat v2 form (`label: - glob`), which v7 rejects outright:
#   "found unexpected type for label 'frontend' (should be array of config
#    options)"
# That went unnoticed only because the repo had never opened a pull
# request, so the workflow had never run on a PR.

frontend:
  - changed-files:
      - any-glob-to-any-file: 'frontend/**'

backend:
  - changed-files:
      - any-glob-to-any-file: 'backend/**'

agent:
  - changed-files:
      - any-glob-to-any-file: 'agents/**'
      - any-glob-to-any-file: 'backend/services/agent/**'

security:
  - changed-files:
      - any-glob-to-any-file: 'backend/services/auth/**'
      - any-glob-to-any-file: 'backend/services/security/**'
      - any-glob-to-any-file: 'backend/services/runtime-security/**'
      - any-glob-to-any-file: 'docs/compliance/**'
      - any-glob-to-any-file: '**/*.pem'
      - any-glob-to-any-file: '**/*.key'

compliance:
  - changed-files:
      - any-glob-to-any-file: 'backend/services/compliance/**'

incidents:
  - changed-files:
      - any-glob-to-any-file: 'backend/services/incident/**'

integrations:
  - changed-files:
      - any-glob-to-any-file: 'backend/services/integration/**'

infra:
  - changed-files:
      - any-glob-to-any-file: 'infra/**'
      - any-glob-to-any-file: 'docker-compose.yml'
      - any-glob-to-any-file: 'Makefile'
      - any-glob-to-any-file: 'Dockerfile'

docs:
  - changed-files:
      - any-glob-to-any-file: 'docs/**'
      - any-glob-to-any-file: '**/*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file: 'pnpm-lock.yaml'
      - any-glob-to-any-file: '**/package.json'
      - any-glob-to-any-file: '**/pyproject.toml'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**'
      - any-glob-to-any-file: '.github/dependabot.yml'
      - any-glob-to-any-file: '.github/labeler.yml'

tests:
  - changed-files:
      - any-glob-to-any-file: '**/*.test.ts'
      - any-glob-to-any-file: '**/*.test.tsx'
      - any-glob-to-any-file: 'tests/**'

breaking-change:
  - changed-files:
      - any-glob-to-any-file: '**/BREAKING.md'
      - any-glob-to-any-file: '**/MIGRATION.md'
